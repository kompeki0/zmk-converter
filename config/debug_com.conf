# Use ZMK's complete CDC ACM logging profile. It selects USB_UART_CONSOLE,
# UART_INTERRUPT_DRIVEN and UART_LINE_CTRL in addition to the CDC device.
CONFIG_ZMK_USB_LOGGING=y

# ZMK initializes the shared HID + CDC USB device itself. Enabling Zephyr's
# automatic initialization as well can leave the CDC console silent.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_ZMK_BLE_HOGP_SNIFFER_POINTER_DEBUG_LOG=y
